name: ${name}
main: net.azisaba.lobby.AzisabaLobby
version: ${version}
author: siloneco
description: ${description}
api-version: 1.13
softdepend:
  - AzisabaAchievements

permissions:
  azisabalobby.allow-interact-flower-pot:
    default: op
    description: 植木鉢の破壊に関するパーミッションです。
  azisabalobby.allow-destroy-painting:
    default: op
    description: 額縁の破壊に関するパーミッションです。
  azisabalobby.command.reload:
    default: op
    description: /azisabalobby reload で設定を再読み込みするためのパーミッションです。

commands:
  secrets:
    permission: azisabalobby.command.secrets
  azisabalobby:
    description: AzisabaLobby の管理コマンドです。
    usage: /azisabalobby reload
    aliases:
      - alobby
